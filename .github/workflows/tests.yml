# XE-006: this repository runs its own checks, or it has no gate.
#
# Not a Playwright/Endform gate: there is no package.json, no vercel.json and no page to drive here,
# and a browser suite over a plugin marketplace would be a green check over nothing. The gate that
# applies to this repository is its own stdlib test suites, and run_all_tests.py fails when it
# discovers none -- a gate that examines nothing is broken, not passing.
name: tests

on:
  pull_request:
  # XE-014.11 / review F2: every push, not only main's, so a branch with no pull request still runs
  # the scorer. A branch with one runs twice; that is the cost.
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI-002.7: the version-bump check diffs against a base commit, and its real-history
      # test reads merges back to 6c9912c. The default depth of 1 has neither, and a check
      # that cannot resolve its range FAILS rather than reporting a tree it never diffed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # XE-014: the coverage scorer is Node. Its dependency is installed from the lockfile here, and
      # test_packet_coverage_run.py FAILS when it is missing, so this job cannot go green with the
      # scorer skipped. No key is set: one test serves a stub gateway through JEV_ENDPOINT.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the coverage scorer's dependency
        working-directory: plugins/gstack-execution
        run: npm ci --no-audit --no-fund

      # SM-004 criterion 20: the scanner tests run rather than skip, so CI installs the pinned gitleaks.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: What this run will examine
        run: python3 plugins/gstack-execution/scripts/run_all_tests.py --list

      # CI-002: this change ships to installs only if its version moves. The suites above
      # prove the check works; this points it at the range being merged right now.
      - name: Every changed plugin moved its version, and so did the marketplace
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push to a branch other than main diffs against where it left main, not against its
          # previous push: a version moves once per merge, not once per fix commit.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit for this event; nothing to diff against"
            exit 0
          fi
          python3 plugins/gstack-execution/scripts/version_bump.py --base "$BASE" --head "$GITHUB_SHA"

      - name: The runner's own check
        run: python3 plugins/gstack-execution/scripts/run_all_tests.py --selftest

      - name: Run every check in the repository
        run: python3 plugins/gstack-execution/scripts/run_all_tests.py
